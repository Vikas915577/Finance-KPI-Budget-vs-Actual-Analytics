name: Finance analytics quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install analysis and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild finance summaries
        run: python python/analyze_finance.py
      - name: Rebuild self-contained dashboard
        run: python python/build_dashboard.py
      - name: Run analytics and dashboard regression tests
        run: python -m unittest discover -s tests -v
